      caption_line: "Watch KreekCraft on YouTube and Twitch!"
      overlay_url: "https://crusercontent.com/organizations/43893b4f-434d-549b-9037-4f1c62984ff2/campaigns/references/assets/a6688393-4374-492e-8ec3-059554a1870f.webp"
