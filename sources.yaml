# ─────────────────────────────────────────────────────────────
#  WHERE CLIPS COME FROM
#  Every source needs a `permission` basis. The bot SKIPS anything without one.
#    own                → your own recordings / your own channel
#    creative_commons   → video is licensed CC-BY on YouTube (bot double-checks)
#    clipping_campaign  → creator pays/allows clippers (Whop, ClipFarm, Vyro, etc.)
#    written_permission → creator said yes by email/DM (keep the screenshot!)
# ─────────────────────────────────────────────────────────────

# 1) Specific videos you are allowed to clip (your GTA 6 gameplay uploads go here)
manual:
  # - url: https://www.youtube.com/watch?v=YOUR_GTA6_VIDEO
  #   permission: own
  #   category: gaming
  #   credit: "@YourChannel"
  #   layout: center_crop        # gameplay looks better cropped full-screen

# 2) Channels that allow clipping. The bot pulls their newest uploads automatically.
allowed_channels:
  # - channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #   permission: clipping_campaign
  #   category: comedy
  #   credit: "@CreatorHandle"
  #   proof: "https://whop.com/... campaign link or email date"

# 3) TRENDING: each run reads YouTube India's trending charts (gaming, comedy, entertainment),
#    picks the hottest topics (e.g. "GTA 6 funny moments") and searches CC-BY videos about them.
trending:
  enabled: true
  categories: [20, 23, 24]          # 20 Gaming, 23 Comedy, 24 Entertainment
  queries_per_run: 2

# 4) Fixed searches (one or two used per run, taking turns). Auto-discover CC-BY licensed videos on YouTube (fully automatic, free to reuse with credit)
creative_commons_search:
  - query: "GTA 6 gameplay"
    category: gaming
    layout: center_crop
  - query: "GTA 6 funny moments"
    category: gaming
    layout: center_crop
  - query: "funny prank"
    category: prank
  - query: "stand up comedy hindi"
    category: comedy
    language: hi
  - query: "comedy sketch funny"
    category: comedy
  - query: "GTA 6 police chase"
    category: gaming
    layout: center_crop
  - query: "GTA 6 glitch"
    category: gaming
    layout: center_crop
  - query: "GTA 6 Vice City gameplay"
    category: gaming
    layout: center_crop
  - query: "public prank india"
    category: prank
    language: hi
