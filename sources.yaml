    permission: clipping_campaign
    category: gaming
    credit: "Dylan Page"
    since: "2026-11-19"
    max_source_seconds: 86400
    recent: 10
    proof: "https://contentrewards.com/c/campaigns/39753a1a-f1f3-491b-a8f6-0cfee0af0c97"
    campaign:
      name: "Dylan Page GTA VI Marathon (Content Rewards)"
      rules: "Dylan must be the main focus; #DylanPage in caption; English only; no added watermarks; $1 per 1K views; campaign ends when the marathon ends."
      mention: "Dylan Page"
      hashtags: ["#DylanPage"]
      no_watermark: true
  # - channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #   permission: clipping_campaign
  #   category: comedy
  #   credit: "@CreatorHandle"
  #   proof: "https://whop.com/... campaign link or email date"

  # Content Rewards: "KreekCraft GTA 6 Clipping" (joined 21 Nov 2026), $0.50 per 1K views.
  # Rules: his logo overlay visible the whole clip; caption "Watch KreekCraft on YouTube and Twitch";
  # #GTA6 #KreekCraft #GrandTheftAutoVI; only his GTA 6 streams; keep clips public 30+ days.
