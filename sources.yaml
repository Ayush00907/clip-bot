# ─────────────────────────────────────────────────────────────
#  WHERE CLIPS COME FROM
#  Every source needs a `permission` basis. The bot SKIPS anything without one.
#    own                → your own recordings / your own channel
#    creative_commons   → video is licensed CC-BY on YouTube (bot double-checks)
#    clipping_campaign  → creator pays/allows clippers (Whop, ClipFarm, Vyro, etc.)
#    written_permission → creator said yes by email/DM (keep the screenshot!)
# ─────────────────────────────────────────────────────────────

# 1) Specific videos you are allowed to clip (your GTA 6 gameplay uploads go here)
manual:
  # - url: https://www.youtube.com/watch?v=YOUR_GTA6_VIDEO
  #   permission: own
  #   category: gaming
  #   credit: "@YourChannel"
  #   layout: center_crop        # gameplay looks better cropped full-screen

# 2) Channels that allow clipping. The bot pulls their newest uploads automatically.
allowed_channels:
  # Content Rewards: "Kai Cenat - $10,000 GTA 6 Pool Campaign" (joined 19 Nov 2026)
  # Rules: Kai must be the main focus, name + #KaiCenat in caption, no logos, nothing negative.
  - channel_id: UCvCfpQXRXdJdL07pzTIA6Cw
    permission: clipping_campaign
    category: gaming
    credit: "Kai Cenat"
    title_must_contain: ["gta"]
    since: "2026-11-18"
    max_source_seconds: 86400        # his marathon streams are many hours long
    proof: "https://contentrewards.com/c/campaigns/1d2bcb00-c904-415f-aa82-f95b96baad86"
    campaign:
      name: "Kai Cenat GTA 6 Pool (Content Rewards)"
      rules: "Kai must be the main focus; name + #KaiCenat in caption; no logos; nothing negative; pool pays once your clips total 750K views (1K+ per clip)."
      mention: "Kai Cenat"
      hashtags: ["#KaiCenat"]
      no_watermark: true

  # Content Rewards: "$5,000 Dylan Page GTA VI Marathon" (joined 19 Nov 2026), $1 per 1K views.
  # Rules: Dylan must be the main focus, #DylanPage in caption, English captions, no added
  # watermarks/branding, no AI voices or footage. Marathon is 120 h LIVE on YouTube.
