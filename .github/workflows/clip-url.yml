name: Clip a URL

# Paste a video URL -> GitHub cuts it into vertical Shorts -> download the zip
# from the run page (Artifacts section). Use on videos you own or may clip.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (YouTube, Twitch, ...)"
        required: true
      count:
        description: "How many clips"
        default: "3"
      layout:
        description: "blur_fit (whole frame) or center_crop (full-screen)"
        default: "blur_fit"
      style:
        description: "hinglish or english hooks/titles"
        default: "hinglish"
      credit:
        description: "Credit line at the bottom (optional), e.g. @Creator"
        default: ""

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-montserrat fonts-noto-core fonts-noto-color-emoji
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
      - name: Cookies for YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi
      - name: Make the clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES_FILE: cookies.txt
          URL: ${{ inputs.url }}
          COUNT: ${{ inputs.count }}
          LAYOUT: ${{ inputs.layout }}
          STYLE: ${{ inputs.style }}
          CREDIT: ${{ inputs.credit }}
          PYTHONUNBUFFERED: "1"
        run: python clip_url.py "$URL" -n "$COUNT" --layout "$LAYOUT" --style "$STYLE" --credit "$CREDIT"
      - name: Download link for the clips
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: clips/
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: rm -f cookies.txt
