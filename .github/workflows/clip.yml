name: Clip Bot

# Started on time by a cron-job.org job through GitHub's workflow_dispatch API
# (same as the Sanatan bot - GitHub's own `schedule:` runs hours late and skips runs).
#   Suggested times: 12:30, 18:00, 21:00 IST
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only (no upload, nothing saved). The video is attached to the run."
        type: boolean
        default: false

permissions:
  contents: write   # saves state/posted.json back to the repo

concurrency:
  group: clipbot
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts (Montserrat + Hindi + emoji)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-montserrat fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}

      - name: Write YouTube credentials and cookies
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > token.json
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Make and upload one clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YT_COOKIES_FILE: cookies.txt
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python -m bot.main

      - name: Save posted log
        if: always() && !inputs.dry_run
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -q -m "Update posted clips log [skip ci]"
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            echo "Push failed (attempt $attempt), retrying..."; sleep 5
          done
          exit 1

      - name: Keep the video for checking (failed or dry runs only)
        if: failure() || inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove credentials
        if: always()
        run: rm -f client_secret.json token.json cookies.txt
