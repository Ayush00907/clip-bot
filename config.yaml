channel_name: "ClipVerse"          # shown as small watermark; change to your channel name
title_style: hinglish              # hinglish = Hinglish hooks/titles for Indian viewers (English-only campaigns stay English)
upload_to_youtube: true             # true = upload automatically (a copy is still saved in Releases)
uploads_per_run: 1
languages: [hi, en]
only_topic: ["gta 6", "gta6", "gta vi", "gtavi", "gta-6", "gta 06", "grand theft auto", "vice city"]   # channel is GTA 6 only: every source title must contain one of these                 # only clip videos in these languages
privacy: public                     # public | unlisted | private  (use private for first tests)

clip:
  min_seconds: 20
  max_seconds: 50
  target_seconds: 35

discovery:
  max_age_days: 21                  # only clip videos uploaded recently (trending)
  min_views: 20000
  min_source_seconds: 60            # ignore sources shorter than this
  max_source_seconds: 2400          # and longer than 40 min (download/transcribe time)
  region: IN
  language: en                      # search results in this language (hi for Hindi); a query can override it
  results_per_query: 15
  searches_per_run: 1                # 100 quota units each; 5 uploads/day x (1,600 + 100) = 8,500 of 10,000

transcription:
  model: base                       # tiny | base | small  (small = better Hindi, slower)

# YouTube category ids: 20 Gaming, 23 Comedy, 24 Entertainment
categories:
  gaming:  {youtube_category: 20, tags: ["gta 6", "gta vi", "gta 6 gameplay", "gta 6 funny moments", "vice city", "gaming", "shorts"]}
  comedy:  {youtube_category: 23, tags: ["comedy", "funny", "standup", "hindi comedy", "shorts"]}
  prank:   {youtube_category: 24, tags: ["prank", "funny prank", "public prank", "shorts"]}
  default: {youtube_category: 24, tags: ["funny", "viral", "clips", "shorts"]}
